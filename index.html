</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <ul class="nav-center">
            <li><a href="index.html">Home</a></li>

        <button class="hamburger" id="hamburgerBtn" aria-label="Ouvrir le menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <!-- MENU MOBILE -->
    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">Home</a>
        <a href="Projets/projet.html">Projets</a>
        <a href="about.html">About me</a>
        <a href="#contact" class="btn-contact-mob">Contact</a>
    </div>

    <!-- HERO -->
    <section class="hero-container">
        <div class="hero-content">
            <h1 class="name">
                PHOMASONE<br>
                <span class="accent">KEVIN</span>
            </h1>
            <p class="subtitle">Étudiant en 1ère année · BUT Informatique</p>
            <div class="hero-cta">
                <a href="Projets/projet.html" class="cta-primary">Voir mes projets</a>
                <a href="assets/Portfolio.pdf" class="cta-secondary">Télécharger CV</a>

        </div>

        <div class="hero-visual">
            <div class="image-wrapper">
                <img src="assets/icon.jpg" alt="Portrait de Kevin Phomasone">
     
            </div>
        </div>
    </section>

    <!-- SOCIAL BAR -->
    <div class="social-bar" id = "contact">
        <span class="social-label">Retrouvez-moi</span>
        <a href="https://www.linkedin.com/in/phomasone-kevin-537251385/" class="social-btn">
            <i class="fab fa-linkedin"></i>
            <span>LinkedIn</span>
        </a>
        <a href="https://github.com/im-midnight" class="social-btn">
            <i class="fab fa-github"></i>
            <span>Github</span>
        </a>  
        <a href="https://www.facebook.com/profile.php?id=100073947349521&sk=directory_intro" class="social-btn">
            <i class="fab fa-facebook-f"></i>
            <span>Facebook</span>
        </a>
        <a href="https://www.instagram.com/im._.kebin/" class="social-btn">
            <i class="fab fa-instagram"></i>
            <span>Instagram</span>
        </a>
    </div>

    <script>
        const btn = document.getElementById('hamburgerBtn');
        const menu = document.getElementById('mobileMenu');
        const closeBtn = document.getElementById('menuClose');

        function openMenu() {
            menu.classList.add('open');
            btn.classList.add('active');
        }
        function closeMenu() {
            menu.classList.remove('open');
            btn.classList.remove('active');
        }

        btn.addEventListener('click', () => {
            menu.classList.contains('open') ? closeMenu() : openMenu();
        });
        closeBtn.addEventListener('click', closeMenu);
        menu.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));
    </script>

</body>
